# OpenSSF Scorecard — continuously assesses the repo's security posture.
# Checks: token permissions, pinned dependencies, branch protection,
# code review practices, and more.
# Results appear in GitHub's Security tab under "Code scanning alerts".
#
# TEMPLATE NOTE: Scorecard is designed for PUBLIC repositories
# (publish_results requires one). If your project is private, delete this
# file — or expect the workflow to fail.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF results
      id-token: write # OIDC token for Scorecard API
      actions: read # Read workflow data for checks
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        # Private repos need GitHub Advanced Security for code scanning.
        # Allow graceful failure so scorecard analysis still runs.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
