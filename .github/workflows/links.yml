# Markdown link checker — validates links in documentation.
# Split strategy:
#   - PR runs: internal links only (relative paths, anchors) — fast, deterministic
#   - Weekly schedule: full external link validation — failures create an issue
# This is NOT a required status check (path-filtered + external flakiness).
# Placeholder URLs (e.g. github.com/your-username/...) are excluded via
# .lycheeignore in the repository root.
name: Links

on:
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    # Run weekly on Monday at 10:00 UTC (after Scorecard at 09:00)
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast internal-only check on PRs (~5s)
  internal-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments "**/*.md"
          fail: true

  # Full external check on schedule — creates issue on failure
  external-links:
    if:
      github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Create issue on broken links
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all links (internal + external)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --include-fragments "**/*.md"
          fail: true

      - name: Create issue on broken links
        if: failure() && steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "ci: broken external links found by weekly check" \
            --label "documentation" \
            --body "The weekly link checker found broken external links.

          See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          🤖 Generated by Links workflow"
