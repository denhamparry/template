# Pre-commit autoupdate — weekly check for newer hook versions.
# Dependabot doesn't support pre-commit natively, so this workflow
# runs `pre-commit autoupdate` and creates a PR if versions changed.
#
# Token strategy: The default GITHUB_TOKEN creates PRs that won't trigger
# other workflows (GitHub's anti-recursion measure). This means the pre-commit
# CI check won't run automatically on autoupdate PRs. Options:
#   1. Use GITHUB_TOKEN (default) — manually trigger CI by closing/reopening the PR
#   2. Use a GitHub App token (PAT_TOKEN secret) — PRs trigger CI automatically
name: Pre-commit autoupdate

on:
  schedule:
    # Run weekly on Tuesday at 09:00 UTC (day after Dependabot)
    - cron: "0 9 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet .pre-commit-config.yaml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No hook updates found"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Hook updates found:"
            git diff .pre-commit-config.yaml
          fi

      - name: Validate updated hooks
        if: steps.changes.outputs.updated == 'true'
        run:
          pre-commit run --all-files || echo "::warning::Updated hooks have
          failures — PR will need manual fixes"

      - name: Create pull request
        if: steps.changes.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/pre-commit-autoupdate
          title: "chore(hooks): update pre-commit hook versions"
          body: |
            Automated pre-commit hook version update.

            Run `pre-commit autoupdate` to update hook versions in
            `.pre-commit-config.yaml`.

            **Note:** If the pre-commit CI check doesn't trigger automatically,
            close and reopen this PR to start it.
          commit-message: "chore(hooks): update pre-commit hook versions"
          labels: housekeeping
          # Customise the assignee for your project
          assignees: denhamparry
