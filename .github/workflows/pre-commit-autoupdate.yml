# Pre-commit autoupdate — weekly check for newer hook versions.
# Dependabot doesn't support pre-commit natively, so this workflow
# runs `pre-commit autoupdate` and creates a PR if versions changed.
#
# Token strategy: mint a GitHub App installation token from the
# APP_CLIENT_ID Actions variable and APP_PRIVATE_KEY secret, scoped to this
# repository with contents:write and pull-requests:write.
# App-authenticated PRs trigger the required pre-commit CI check.
name: Pre-commit autoupdate

on:
  schedule:
    # Run weekly on Tuesday at 09:00 UTC (day after Dependabot)
    - cron: "0 9 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet .pre-commit-config.yaml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No hook updates found"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Hook updates found:"
            git diff .pre-commit-config.yaml
          fi

      - name: Validate updated hooks
        if: steps.changes.outputs.updated == 'true'
        run:
          pre-commit run --all-files || echo "::warning::Updated hooks have
          failures — PR will need manual fixes"

      - name: Check App credentials
        if: steps.changes.outputs.updated == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure the APP_CLIENT_ID variable and APP_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Resolve App token repository
        if: steps.changes.outputs.updated == 'true'
        id: app-repository
        run: |
          if [[ ! "${GITHUB_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::GITHUB_REPOSITORY must contain a nonempty owner/repository pair"
            exit 1
          fi
          repository_name="${GITHUB_REPOSITORY#*/}"
          echo "name=$repository_name" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.changes.outputs.updated == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repository.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Assert App token is present
        if: steps.changes.outputs.updated == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::App installation token is empty"
            exit 1
          fi

      - name: Create pull request
        if: steps.changes.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/pre-commit-autoupdate
          title: "chore(hooks): update pre-commit hook versions"
          body: |
            Automated pre-commit hook version update.

            Run `pre-commit autoupdate` to update hook versions in
            `.pre-commit-config.yaml`.
          commit-message: "chore(hooks): update pre-commit hook versions"
          labels: housekeeping
          # Customise the assignee for your project
          assignees: denhamparry
